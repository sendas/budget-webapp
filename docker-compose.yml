services:
  financebros:
    build: .
    container_name: financebros
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: "trocar-esta-chave-antes-de-usar"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_DEBUG: "0"
    volumes:
      - budget_data:/app/data
      - budget_static:/app/staticfiles

volumes:
  budget_data:
  budget_static:
