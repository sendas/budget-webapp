{% extends "finance/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="form-shell">
  <div class="panel form-panel">
    <h1>{{ title }}</h1>
    <form method="post" class="stacked-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="button" type="submit">{{ button_label }}</button>
    </form>
  </div>
</section>
{% endblock %}
