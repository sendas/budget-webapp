{% extends "finance/base.html" %}
{% block title %}{{ UI.pending_title }} · {{ UI.app_name }}{% endblock %}
{% block content %}
<section class="form-shell">
  <div class="panel form-panel center">
    <p class="eyebrow">{{ UI.account_created }}</p>
    <h1>{{ UI.pending_title }}</h1>
    <p>{{ UI.pending_copy }}</p>
    <a class="button" href="{% url 'login' %}">{{ UI.back_to_login }}</a>
  </div>
</section>
{% endblock %}
