{% extends "finance/base.html" %}
{% block title %}{{ UI.signup }} · {{ UI.app_name }}{% endblock %}
{% block content %}
<section class="auth-layout">
  <div class="auth-copy">
    <p class="eyebrow">{{ UI.signup }}</p>
    <h1>{{ UI.signup_title }}</h1>
    <p>{{ UI.signup_copy }}</p>
  </div>
  <div class="panel form-panel">
    <form method="post" class="stacked-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="button" type="submit">{{ UI.request_access }}</button>
    </form>
  </div>
</section>
{% endblock %}
